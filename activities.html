<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลงานและกิจกรรม | Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Tahoma", "Arial", sans-serif; background: #F9D1D9; color: #000000; overflow-x: hidden; }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -10; pointer-events: none;
            background-image: radial-gradient(circle, #FFFFFF 2px, transparent 2px); background-size: 45px 45px; opacity: 0.9;
        }
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            display: flex; justify-content: center; align-items: center; padding: 18px 15px;
            background: rgba(249, 209, 217, 0.95); backdrop-filter: blur(8px); border-bottom: 2px solid #000000;
        }
        .nav-menu { list-style: none; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
        .nav-menu a {
            display: inline-block; text-decoration: none; color: #000000; background: #FFFFFF;
            border: 2px solid #000000; border-radius: 30px; padding: 10px 18px; font-size: 16px; font-weight: bold; transition: 0.3s ease;
        }
        .nav-menu a.active, .nav-menu a:hover {
            background: #F9D1D9; transform: translateY(-4px) scale(1.05); box-shadow: 4px 4px 0 #000000;
        }
        section { min-height: 100vh; padding: 150px 30px 80px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .page-title { font-size: clamp(42px, 7vw, 80px); font-weight: 900; color: #000000; text-align: center; margin-bottom: 45px; text-shadow: 4px 4px 0 #FFFFFF; }
        .works-grid { width: min(1000px, 95%); display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        .work-card { background: #FFFFFF; border: 3px solid #000000; border-radius: 20px; padding: 15px; box-shadow: 7px 7px 0 #000000; transition: 0.3s ease; }
        .work-card:hover { transform: translateY(-8px); }
        .work-card img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border: 2px solid #000000; border-radius: 12px; }
        .work-title { text-align: center; font-size: 18px; font-weight: bold; padding: 15px 5px 5px; color: #000000; }
        footer { text-align: center; padding: 30px; color: #000000; font-weight: bold; }
        @media (max-width: 700px) { .works-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <ul class="nav-menu">
            <li><a href="index.html">🦋 หน้าแรก 🦋</a></li>
            <li><a href="introduction.html">🦋 คำนำ 🦋</a></li>
            <li><a href="profile.html">🦋 ข้อมูลเพิ่มเติม 🦋</a></li>
            <li><a href="activities.html" class="active">🦋 ผลงานและกิจกรรม 🦋</a></li>
            <li><a href="contact.html">🦋 ช่องทางการติดต่อ 🦋</a></li>
        </ul>
    </nav>

    <section>
        <h1 class="page-title">ผลงานและกิจกรรม</h1>
        <div class="works-grid">
            <div class="work-card">
                <img src="images/activity1.jpg" alt="ผลงานและกิจกรรมที่ 1">
                <div class="work-title">ผลงานและกิจกรรมที่ 1</div>
            </div>
            <div class="work-card">
                <img src="images/IMG_6456.jpeg" alt="ผลงานและกิจกรรมที่ 2">
                <div class="work-title">ผลงานและกิจกรรมที่ 2</div>
            </div>
            <div class="work-card">
                <img src="images/activity3.jpg" alt="ผลงานและกิจกรรมที่ 3">
                <div class="work-title">ผลงานและกิจกรรมที่ 3</div>
            </div>
            <div class="work-card">
                <img src="images/activity4.jpg" alt="ผลงานและกิจกรรมที่ 4">
                <div class="work-title">ผลงานและกิจกรรมที่ 4</div>
            </div>
        </div>
    </section>

    <footer>© 2026 Kanruthai Jaisawang | Portfolio</footer>
</body>
</html>
