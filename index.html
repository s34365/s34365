<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Kanruthai Jaisawang</title>

    <style>
        /* ========================================
           ตั้งค่าพื้นฐาน
        ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Tahoma", "Arial", sans-serif;
            background: #F9D1D9;
            color: #000000;
            overflow-x: hidden;
        }

        /* ========================================
           จุดสีขาวจำนวนมากบนพื้นหลัง
        ======================================== */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -10;
            pointer-events: none;
            background-image:
                radial-gradient(circle, #FFFFFF 2px, transparent 2px),
                radial-gradient(circle, #FFFFFF 1.5px, transparent 1.5px),
                radial-gradient(circle, #FFFFFF 2.5px, transparent 2.5px);
            background-size:
                45px 45px,
                70px 70px,
                100px 100px;
            background-position:
                0 0,
                20px 30px,
                50px 15px;
            opacity: 0.9;
        }

        /* ========================================
           แถบเมนูด้านบน
        ======================================== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px 15px;
            background: rgba(249, 209, 217, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid #000000;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-menu a {
            display: inline-block;
            text-decoration: none;
            color: #000000;
            background: #FFFFFF;
            border: 2px solid #000000;
            border-radius: 30px;
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .nav-menu a:hover {
            background: #F9D1D9;
            transform: translateY(-4px) scale(1.05);
            box-shadow: 4px 4px 0 #000000;
        }

        /* ========================================
           แต่ละ Section
        ======================================== */
        section {
            min-height: 100vh;
            padding: 150px 30px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* ========================================
           หัวข้อใหญ่
        ======================================== */
        .main-title {
            font-size: clamp(55px, 9vw, 110px);
            font-weight: 900;
            color: #000000;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 50px;
            text-shadow: 5px 5px 0 #FFFFFF;
        }

        .page-title {
            font-size: clamp(42px, 7vw, 80px);
            font-weight: 900;
            color: #000000;
            text-align: center;
            margin-bottom: 45px;
            text-shadow: 4px 4px 0 #FFFFFF;
        }

        /* ========================================
           รูป Portfolio หน้าแรก
        ======================================== */
        .profile-image {
            width: 330px;
            height: 330px;
            background: #FFFFFF;
            border: 4px solid #000000;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 45px;
            box-shadow: 10px 10px 0 #000000;
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ========================================
           กล่องข้อความ
        ======================================== */
        .info-box {
            width: min(900px, 95%);
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 25px;
            padding: 35px 40px;
            box-shadow: 8px 8px 0 #000000;
        }

        .info-box p {
            font-size: 18px;
            line-height: 1.9;
            margin-bottom: 8px;
            color: #000000;
        }

        .info-label {
            font-weight: bold;
        }

        /* ========================================
           ส่วนคำนำ
        ======================================== */
        .introduction-box {
            max-width: 900px;
        }

        .introduction-box p {
            font-size: 20px;
            line-height: 2;
            text-align: justify;
            color: #000000;
        }

        /* ========================================
           ผลงานและกิจกรรม
        ======================================== */
        .works-grid {
            width: min(1000px, 95%);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .work-card {
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 7px 7px 0 #000000;
            transition: 0.3s ease;
        }

        .work-card:hover {
            transform: translateY(-8px);
        }

        .work-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border: 2px solid #000000;
            border-radius: 12px;
        }

        .work-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 5px 5px;
            color: #000000;
        }

        /* ========================================
           ช่องทางการติดต่อ
        ======================================== */
        .contact-box {
            width: min(700px, 95%);
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 8px 8px 0 #000000;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px 0;
            border-bottom: 2px dashed #000000;
            font-size: 20px;
            color: #000000;
        }

        .contact-item:last-child {
            border-bottom: none;
        }

        .contact-icon {
            font-size: 30px;
        }

        .contact-item a {
            color: #000000;
            font-weight: bold;
            text-decoration: none;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        /* ========================================
           ตัวโน้ต + โบว์ + หัวใจ ลอยไปมา
        ======================================== */
        .floating {
            position: fixed;
            z-index: -1;
            color: #000000;
            font-size: 32px;
            pointer-events: none;
            user-select: none;
            animation: floating 7s ease-in-out infinite;
        }

        .f1 { top: 15%; left: 5%; animation-delay: 0s; }
        .f2 { top: 25%; right: 6%; animation-delay: 1s; }
        .f3 { top: 42%; left: 8%; animation-delay: 2s; }
        .f4 { top: 55%; right: 8%; animation-delay: 3s; }
        .f5 { top: 70%; left: 5%; animation-delay: 4s; }
        .f6 { top: 80%; right: 10%; animation-delay: 2s; }
        .f7 { top: 12%; right: 25%; animation-delay: 3s; }
        .f8 { top: 65%; right: 25%; animation-delay: 1.5s; }
        .f9 { top: 35%; left: 25%; animation-delay: 4s; }
        .f10 { top: 85%; left: 30%; animation-delay: 2.5s; }
        .f11 { top: 50%; right: 40%; animation-delay: 5s; }
        .f12 { top: 20%; left: 40%; animation-delay: 3.5s; }

        @keyframes floating {
            0% { transform: translate(0, 0) rotate(-8deg); }
            25% { transform: translate(25px, -30px) rotate(8deg); }
            50% { transform: translate(-20px, -60px) rotate(-5deg); }
            75% { transform: translate(30px, -25px) rotate(10deg); }
            100% { transform: translate(0, 0) rotate(-8deg); }
        }

        /* ========================================
           Footer
        ======================================== */
        footer {
            text-align: center;
            padding: 30px;
            color: #000000;
            font-weight: bold;
        }

        /* ========================================
           Responsive สำหรับโทรศัพท์
        ======================================== */
        @media (max-width: 700px) {
            .navbar { padding: 10px; }
            .nav-menu { gap: 6px; }
            .nav-menu a { font-size: 11px; padding: 8px 9px; }
            section { padding: 130px 15px 60px; }
            .profile-image { width: 260px; height: 260px; }
            .info-box { padding: 25px; }
            .info-box p { font-size: 16px; }
            .introduction-box p { font-size: 17px; }
            .works-grid { grid-template-columns: 1fr; }
            .contact-box { padding: 25px; }
            .contact-item { font-size: 16px; }
            .floating { font-size: 22px; }
        }
    </style>
</head>
